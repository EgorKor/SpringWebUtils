name: Simple Java Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04 # или другой доступный runner
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Build and Test
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-21-jdk maven
          mvn -B clean package